<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Irregular Verbs Path</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 12px;background:radial-gradient(ellipse at top,#a95731,#392317 75%);color:#302019;font:16px/1.45 system-ui,sans-serif;min-height:100vh}
main{max-width:820px;margin:auto;background:#fff5db;border:4px solid #dfa43a;border-radius:24px;overflow:hidden;box-shadow:0 12px 38px #1a0c0890}
header{text-align:center;padding:24px 12px;color:#fff4cc;background:linear-gradient(145deg,#5c131c,#a52326);border-bottom:4px solid #dfa43a}
h1{font:bold clamp(1.8rem,6vw,3rem)/1.1 Georgia,serif;margin:6px 0 10px}
p{margin:0}.sheet{padding:clamp(12px,3vw,26px)}
.details{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:18px}
.details label,.score{font-weight:750;font-size:.9rem;min-width:0}
.details input{display:block;width:100%;min-height:42px;margin-top:4px;border:1px solid #95622e;border-radius:8px;background:#fffdf6;padding:6px 9px;font:inherit}
.score{background:#f8dda1;border-radius:9px;padding:6px 12px;text-align:center}
output{display:block;font-size:1.15rem;color:#711b20}
fieldset{min-width:0;margin:0 0 12px;border:1px solid #d7b47a;border-radius:13px;padding:9px 12px 12px;background:#fffdf6}
legend{max-width:100%;padding:0 5px;font-weight:750}.number{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#f4cb67;color:#4f2b11;margin-right:4px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.choice{display:flex;gap:5px;align-items:center;justify-content:center;min-height:44px;border:1px solid #bd9560;border-radius:8px;cursor:pointer;font-weight:650;background:#fff8e8}
.choice input{margin:0;accent-color:#8b2227}.choice:has(input:checked){background:#fae0a1;border-color:#795014}
.choice.correct{background:#dff2df;border-color:#3e7950}.choice.incorrect{background:#ffe4df;border-color:#a74038}
.feedback{margin-top:5px;font-size:.9rem}.feedback:empty{display:none}
.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:15px}
button{min-height:44px;padding:8px 19px;cursor:pointer;border-radius:10px;border:1px solid #a36f38;font:inherit;font-weight:750;background:#fff9ed;color:#582d22}
button[type=submit]{background:#8a2029;color:#fff;border-color:#681820}
#status{text-align:center;margin-top:9px;font-weight:650}
:focus-visible{outline:3px solid #155b91;outline-offset:3px}
</style>
</head>
<body>
<main>
<header><h1>The Irregular Verbs Path</h1><p>Choose the correct past form of each verb.</p></header>
<form id="worksheet" class="sheet" autocomplete="off">
<div class="details">
<label>Name<input name="student" type="text" dir="auto"></label>
<label>Class<input name="class" type="text" dir="auto"></label>
<div class="score">Score<output id="score">— / 5</output></div>
</div>
<fieldset data-answer="1">
<legend><span class="number">1</span> <span aria-hidden="true">🏔️</span> I (go) to the mountains yesterday.</legend>
<div class="choices">
<label class="choice"><input type="radio" name="q1" value="0"> goed</label>
<label class="choice"><input type="radio" name="q1" value="1"> went</label>
<label class="choice"><input type="radio" name="q1" value="2"> go</label>
</div><p class="feedback"></p>
</fieldset>
<fieldset data-answer="0">
<legend><span class="number">2</span> <span aria-hidden="true">🍔</span> She (eat) a burger last night.</legend>
<div class="choices">
<label class="choice"><input type="radio" name="q2" value="0"> ate</label>
<label class="choice"><input type="radio" name="q2" value="1"> eated</label>
<label class="choice"><input type="radio" name="q2" value="2"> eats</label>
</div><p class="feedback"></p>
</fieldset>
<fieldset data-answer="2">
<legend><span class="number">3</span> <span aria-hidden="true">🐦</span> We (see) a bird in the garden.</legend>
<div class="choices">
<label class="choice"><input type="radio" name="q3" value="0"> seen</label>
<label class="choice"><input type="radio" name="q3" value="1"> seed</label>
<label class="choice"><input type="radio" name="q3" value="2"> saw</label>
</div><p class="feedback"></p>
</fieldset>
<fieldset data-answer="1">
<legend><span class="number">4</span> <span aria-hidden="true">📚</span> They (buy) new books yesterday.</legend>
<div class="choices">
<label class="choice"><input type="radio" name="q4" value="0"> buyed</label>
<label class="choice"><input type="radio" name="q4" value="1"> bought</label>
<label class="choice"><input type="radio" name="q4" value="2"> buy</label>
</div><p class="feedback"></p>
</fieldset>
<fieldset data-answer="0">
<legend><span class="number">5</span> <span aria-hidden="true">🐪</span> He (take) a trip last week.</legend>
<div class="choices">
<label class="choice"><input type="radio" name="q5" value="0"> took</label>
<label class="choice"><input type="radio" name="q5" value="1"> taked</label>
<label class="choice"><input type="radio" name="q5" value="2"> taken</label>
</div><p class="feedback"></p>
</fieldset>
<div class="actions"><button type="submit">Check answers</button><button type="button" id="retry">Try again</button></div>
<p id="status" role="status"></p>
</form>
</main>
<script>
const form = document.getElementById('worksheet');
const score = document.getElementById('score');
const status = document.getElementById('status');
const questions = [...form.querySelectorAll('fieldset')];

function clearResults() {
  score.textContent = '— / 5';
  status.textContent = '';
  for (const question of questions) {
    question.querySelector('.feedback').textContent = '';
    for (const choice of question.querySelectorAll('.choice')) {
      choice.classList.remove('correct', 'incorrect');
    }
  }
}

form.addEventListener('submit', (event) => {
  event.preventDefault();
  clearResults();
  const unanswered = questions.find((question) => !question.querySelector('input:checked'));
  if (unanswered) {
    status.textContent = 'Choose one answer for every sentence.';
    unanswered.querySelector('input').focus();
    return;
  }

  let total = 0;
  for (const question of questions) {
    const selected = question.querySelector('input:checked');
    const correct = selected.value === question.dataset.answer;
    if (correct) total++;
    selected.closest('label').classList.add(correct ? 'correct' : 'incorrect');
    question.querySelector('.feedback').textContent = correct ? '✓ Correct' : '✗ Incorrect';
  }
  score.textContent = total + ' / ' + questions.length;
  score.scrollIntoView({block: 'nearest'});
});

form.addEventListener('change', (event) => {
  if (event.target.type === 'radio') clearResults();
});

document.getElementById('retry').addEventListener('click', () => {
  for (const radio of form.querySelectorAll('input[type=radio]')) radio.checked = false;
  clearResults();
  questions[0].querySelector('input').focus();
});
</script>
</body>
</html>
